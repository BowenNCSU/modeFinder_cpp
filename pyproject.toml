[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "modefinder"
version = "0.1.0"
description = "Univariate mode estimation via Bernstein polynomials (C port of the modeFinder R package)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Bowen Liu", email = "bliu17@ncsu.edu"}]
classifiers = [
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Paper = "https://doi.org/10.1016/j.csda.2020.107046"

[tool.setuptools]
packages = ["modefinder"]
